<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>心之語｜Heart Whisper</title>
<meta name="theme-color" content="#F7ECE1" />
<meta name="description" content="心之語：療癒抽卡、心情紀錄與晚安儀式。每天，留一點時間給自己。" />
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #F5EADF; }
  #root { min-height: 100vh; }
  #boot {
    min-height: 100vh; display: grid; place-items: center; padding: 24px;
    font-family: "Noto Sans TC", system-ui, sans-serif; color: #806B62;
    background:
      radial-gradient(circle at 10% 8%, rgba(247,216,209,.72), transparent 28rem),
      radial-gradient(circle at 92% 14%, rgba(218,202,240,.72), transparent 26rem),
      linear-gradient(180deg, #FFF9F3, #F3E6D8);
  }
  .boot-card {
    width: min(310px, 88vw); padding: 34px 24px; text-align: center; border-radius: 28px;
    background: rgba(255,252,248,.72); border: 1px solid rgba(255,255,255,.88);
    box-shadow: 0 20px 60px -34px rgba(102,73,91,.42); backdrop-filter: blur(12px);
  }
  .boot-moon {
    width: 42px; height: 42px; margin: 0 auto 15px; border: 2px solid #C99B50; border-right-color: transparent;
    border-radius: 50%; transform: rotate(-16deg); opacity: .78;
  }
  .boot-title { font-family: "Noto Serif TC", serif; font-size: 22px; letter-spacing: .18em; margin-left: .18em; color: #634C42; }
  .boot-copy { margin-top: 9px; font-size: 13.5px; line-height: 1.8; color: #9A8378; white-space: pre-line; }
</style>

<!-- 瀏覽器看不懂 React 這類裸模組名，import map 負責把它們對應到實際網址 -->
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?deps=react@18.3.1"
  }
}
</script>

<!-- JSX 瀏覽器不認得，靠 Babel 在使用者端即時轉譯 -->
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
</head>
<body>
  <div id="root"><div id="boot"><div class="boot-card"><div class="boot-moon"></div><div class="boot-title">心之語</div><div class="boot-copy">正在替今天留一點安靜的時間……</div></div></div></div>

  <script type="module">
    const boot = document.getElementById("boot");
    const fail = (msg) => { if (boot) boot.innerHTML = `<div class="boot-card"><div class="boot-title">載入失敗</div><div class="boot-copy">${String(msg)}\n\n請重新整理頁面，或按 F12 查看主控台。</div></div>`; };

    try {
      /* 為什麼要自己抓檔案再轉譯，而不是用 <script type="text/babel" src="...">：
         那種寫法轉出來的模組是匿名的，本檔沒辦法 import 它拿到 App。
         改成手動轉譯成 blob module，import map 一樣適用，也不需要任何打包步驟。 */
      const res = await fetch("./xin-zhi-yu.jsx");
      if (!res.ok) throw new Error("找不到 xin-zhi-yu.jsx（HTTP " + res.status + "）");
      const source = await res.text();

      // 只開 react preset，不動 import／export，讓瀏覽器自己走 ESM
      const { code } = Babel.transform(source, {
        presets: ["react"],
        sourceType: "module",
        filename: "xin-zhi-yu.jsx",
      });

      const url = URL.createObjectURL(new Blob([code], { type: "text/javascript" }));
      const [{ default: App }, React, { createRoot }] = await Promise.all([
        import(url),
        import("react"),
        import("react-dom/client"),
      ]);
      URL.revokeObjectURL(url);

      createRoot(document.getElementById("root")).render(React.createElement(App));
    } catch (e) {
      console.error(e);
      fail(e.message || String(e));
    }
  </script>
</body>
</html>
